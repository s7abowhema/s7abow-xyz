<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptikLink - Control Panel</title>
    <style>
        :root {
            --bg-darker: #0d111a;
            --bg-card: #151a26;
            --bg-input: #090c13;
            --border-panel: #1f2638;
            --accent-green: #10b981;
            --accent-indigo: #4f46e5;
            --accent-red: #ef4444;
            --text-light: #e2e8f0;
            --text-gray: #718096;
            --accent-blue: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-darker);
            color: var(--text-light);
            margin: 0;
            padding: 0;
        }

        .top-navbar {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-panel);
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }
        .logo-section {
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .nav-links {
            display: flex;
            gap: 5px;
            height: 100%;
        }
        .nav-tab {
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 14px;
            font-weight: 600;
            padding: 0 15px;
            cursor: pointer;
            height: 60px;
            display: flex;
            align-items: center;
            transition: 0.2s;
            border-bottom: 3px solid transparent;
        }
        .nav-tab:hover, .nav-tab.active {
            color: #fff;
            border-bottom: 3px solid var(--accent-blue);
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* كروت مراقبة الموارد التفاعلية الحية */
        .resources-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        @media(min-width: 768px) {
            .resources-grid { grid-template-columns: repeat(3, 1fr); }
        }
        .resource-card {
            background: var(--bg-card);
            border: 1px solid var(--border-panel);
            border-radius: 8px;
            padding: 16px;
        }
        .card-title {
            font-size: 11px;
            color: var(--text-gray);
            text-transform: uppercase;
            font-weight: 700;
            display: block;
            margin-bottom: 6px;
        }
        .card-value {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
        }

        /* شريط الحالة والتحكم بالاستضافة */
        .status-and-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-panel);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 15px;
        }
        .status-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot-OFFLINE { background: var(--accent-red); }
        .dot-STARTING { background: #f59e0b; animation: blink 0.8s infinite alternate; }
        .dot-RUNNING { background: var(--accent-green); }

        @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

        .btn-group { display: flex; gap: 8px; }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            color: #fff;
            transition: 0.2s;
        }
        .btn-start { background: var(--accent-green); }
        .btn-restart { background: var(--accent-indigo); }
        .btn-stop { background: var(--accent-red); }
        .btn:hover { filter: brightness(1.1); }

        /* منطقة الـ Terminal والكونسول المتكامل */
        .terminal-container {
            background-color: #060913;
            border: 1px solid var(--border-panel);
            border-radius: 6px;
            overflow: hidden;
        }
        .terminal-screen {
            padding: 15px;
            font-family: monospace;
            height: 380px;
            overflow-y: auto;
            color: #cbd5e1;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.5;
        }
        .terminal-input-bar {
            display: flex;
            background-color: var(--bg-input);
            border-top: 1px solid var(--border-panel);
            padding: 10px 15px;
            align-items: center;
        }
        .terminal-prefix {
            color: var(--text-gray);
            font-family: monospace;
            margin-right: 10px;
            font-size: 13px;
        }
        .terminal-input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-family: monospace;
            outline: none;
            font-size: 13px;
        }

        /* قسم إدارة واستضافة الملفات الحقيقية */
        .files-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .file-list-box {
            background: var(--bg-card);
            border: 1px solid var(--border-panel);
            border-radius: 6px;
            overflow: hidden;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-panel);
        }
        .file-item:last-child { border-bottom: none; }
        .file-main-info { display: flex; align-items: center; gap: 12px; }
        .file-display-name { font-size: 14px; font-weight: 500; color: #fff; }
        .file-meta-data { font-size: 12px; color: var(--text-gray); margin-top: 2px; }
        
        .file-actions-btns { display: flex; gap: 8px; }
        .act-btn {
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            color: white;
        }
        .act-unarchive { background: var(--accent-indigo); }
        .act-delete { background: var(--accent-red); }

        .hidden { display: none !important; }
        .overlay-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 17, 26, 0.9); display: flex; justify-content: center; align-items: center; z-index: 10000; color: #fff; font-weight: bold; font-family: sans-serif; }
    </style>
</head>
<body>

    <div id="uploadLoader" class="overlay-loader hidden">Uploading file to storage container...</div>

    <nav class="top-navbar">
        <div class="logo-section">OptikLink Cloud</div>
        <div class="nav-links">
            <button class="nav-tab active" id="tab-console" onclick="toggleView('console')">Console</button>
            <button class="nav-tab" id="tab-files" onclick="toggleView('files')">File Manager</button>
        </div>
    </nav>

    <div class="container">
        
        <div id="view-console">
            <div class="resources-grid">
                <div class="resource-card">
                    <span class="card-title">CPU Usage</span>
                    <span class="card-value" id="cpu-monitor">0.00 %</span>
                </div>
                <div class="resource-card">
                    <span class="card-title">Memory (RAM)</span>
                    <span class="card-value" id="ram-monitor">0.00 MB / 1024 MB</span>
                </div>
                <div class="resource-card">
                    <span class="card-title">Disk Storage</span>
                    <span class="card-value">14.20 MB / 5120 MB</span>
                </div>
            </div>

            <div class="status-and-buttons">
                <div class="status-box">
                    <span id="status-dot" class="status-dot dot-OFFLINE"></span>
                    <span id="status-text">OFFLINE</span>
                </div>
                <div class="btn-group">
                    <button class="btn btn-start" onclick="sendControl('start')">START</button>
                    <button class="btn btn-restart" onclick="sendControl('restart')">RESTART</button>
                    <button class="btn btn-stop" onclick="sendControl('stop')">STOP</button>
                </div>
            </div>

            <div class="terminal-container">
                <div class="terminal-screen" id="terminal-logs">Connecting to active terminal session...</div>
                <div class="terminal-input-bar">
                    <span class="terminal-prefix">optiklink@pterodactyl:~#</span>
                    <input type="text" id="terminal-input" class="terminal-input" placeholder="Type a command..." onkeydown="submitCommand(event)">
                </div>
            </div>
        </div>

        <div id="view-files" class="hidden">
            <div class="files-top-bar">
                <span>Directory: <code style="background:#1c2336; padding:3px 6px; border-radius:4px; font-size: 13px;">/home/container</code></span>
                <input type="file" id="actual-uploader" style="display:none;" onchange="uploadFileToServer()">
                <button class="btn btn-start" onclick="document.getElementById('actual-uploader').click()">Upload File</button>
            </div>

            <div class="file-list-box" id="files-render-target"></div>
        </div>

    </div>

<script>
    // إقامة اتصال البث الحي المتزامن مع الاستضافة
    const stream = new EventSource('/api/console/stream');
    stream.onmessage = function(event) {
        const data = JSON.parse(event.data);
        const logs = document.getElementById('terminal-logs');
        
        if(data.log) {
            logs.innerText += "\n" + data.log;
            logs.scrollTop = logs.scrollHeight;
        }

        document.getElementById('status-dot').className = `status-dot dot-${data.status}`;
        document.getElementById('status-text').textContent = data.status;

        // توليد ديناميكي لاستهلاك موارد الخادم بناءً على حالة الحاوية
        if (data.status === 'RUNNING') {
            document.getElementById('cpu-monitor').textContent = (Math.random() * 3 + 1.2).toFixed(2) + " %";
            document.getElementById('ram-monitor').textContent = (Math.random() * 12 + 138).toFixed(2) + " MB / 1024 MB";
        } else if (data.status === 'STARTING') {
            document.getElementById('cpu-monitor').textContent = "24.10 %";
            document.getElementById('ram-monitor').textContent = "72.40 MB / 1024 MB";
        } else {
            document.getElementById('cpu-monitor').textContent = "0.00 %";
            document.getElementById('ram-monitor').textContent = "0.00 MB / 1024 MB";
        }
    };

    function toggleView(view) {
        if(view === 'console') {
            document.getElementById('view-console').classList.remove('hidden');
            document.getElementById('view-files').classList.add('hidden');
            document.getElementById('tab-console').classList.add('active');
            document.getElementById('tab-files').classList.remove('active');
        } else {
            document.getElementById('view-console').classList.add('hidden');
            document.getElementById('view-files').classList.remove('hidden');
            document.getElementById('tab-console').classList.remove('active');
            document.getElementById('tab-files').classList.add('active');
            refreshStorage();
        }
    }

    async function sendControl(action) {
        await fetch('/api/bot/control', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ action })
        });
    }

    async function submitCommand(e) {
        if(e.key === 'Enter') {
            const input = document.getElementById('terminal-input');
            const command = input.value.trim();
            if(!command) return;

            document.getElementById('terminal-logs').innerText += `\n$ ${command}`;
            input.value = '';

            await fetch('/api/console/command', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ command })
            });
        }
    }

    async function refreshStorage() {
        const target = document.getElementById('files-render-target');
        const res = await fetch('/api/files');
        const data = await res.json();
        target.innerHTML = "";

        if(!data.files || data.files.length === 0) {
            target.innerHTML = `<div style="padding:30px; text-align:center; color:var(--text-gray); font-size:14px;">Container storage is completely empty.</div>`;
            return;
        }

        data.files.forEach(file => {
            const isZip = file.name.toLowerCase().includes('.zip');
            const unarchiveBtn = isZip ? `<button class="act-btn act-unarchive" onclick="fileAction('unarchive', '${file.name}')">Unarchive</button>` : '';
            const icon = file.isFolder ? '📁' : '📄';

            target.innerHTML += `
                <div class="file-item">
                    <div class="file-main-info">
                        <span style="font-size:18px;">${icon}</span>
                        <div>
                            <div class="file-display-name">${file.name}</div>
                            <div class="file-meta-data">Size: ${file.size} | Modified: ${file.time}</div>
                        </div>
                    </div>
                    <div class="file-actions-btns">
                        ${unarchiveBtn}
                        <button class="act-btn act-delete" onclick="fileAction('delete', '${file.name}')">Delete</button>
                    </div>
                </div>
            `;
        });
    }

    function uploadFileToServer() {
        const input = document.getElementById('actual-uploader');
        if(input.files.length === 0) return;

        const fd = new FormData();
        fd.append('file', input.files[0]);
        document.getElementById('uploadLoader').classList.remove('hidden');

        const xhr = new XMLHttpRequest();
        xhr.onload = () => {
            document.getElementById('uploadLoader').classList.add('hidden');
            input.value = "";
            refreshStorage();
        };
        xhr.open('POST', '/api/files/upload');
        xhr.send(fd);
    }

    async function fileAction(action, name) {
        const cleanName = name.endsWith('/') ? name.slice(0, -1) : name;
        await fetch('/api/files/action', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ action, fileName: cleanName })
        });
        refreshStorage();
    }
</script>
</body>
</html>
