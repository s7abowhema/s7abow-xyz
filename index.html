<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OptikLink | Control Panel</title>
    <style>
        :root {
            --bg-main: #0b0d19;
            --bg-card: #111424;
            --border: #1d223d;
            --text-muted: #626c93;
            --red: #da3637;
            --green: #2ea44f;
            --blue: #0076ff;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: #fff;
            margin: 0;
            padding: 0;
        }
        .sidebar {
            width: 70px;
            background: var(--bg-card);
            position: fixed;
            height: 100vh;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            gap: 25px;
        }
        .sidebar-icon {
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
        }
        .sidebar-icon.active { color: var(--blue); background: rgba(0,118,255,0.1); }
        .main-content { margin-right: 70px; padding: 30px; }
        .nav-tabs { display: flex; gap: 20px; border-bottom: 2px solid var(--border); margin-bottom: 20px; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: var(--text-muted); font-size: 16px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { color: #fff; border-bottom: 2px solid var(--blue); padding-bottom: 10px; margin-bottom: -12px; }
        
        /* كروت الستيت والكونسول */
        .info-bar { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 15px; margin-bottom: 20px; font-size: 14px; color: var(--text-muted); }
        .status-dot { width: 8px; height: 8px; display: inline-block; border-radius: 50%; margin-left: 5px; }
        .status-offline { background: var(--red); }
        .status-online { background: var(--green); }
        
        .btn-action-group { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .btn-ctrl { padding: 8px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: #fff; }
        .btn-start { background: var(--green); }
        .btn-restart { background: #5c6bc0; }
        .btn-stop { background: var(--red); }
        
        .console-screen { background: #070913; border: 1px solid var(--border); border-radius: 6px; padding: 20px; font-family: monospace; height: 300px; overflow-y: auto; color: #a5b3e6; text-align: left; direction: ltr; }
        
        /* مدير الملفات */
        .files-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .file-table { width: 100%; border-collapse: collapse; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; }
        .file-table th, .file-table td { padding: 15px; text-align: right; border-bottom: 1px solid var(--border); }
        .file-table th { color: var(--text-muted); font-size: 14px; }
        .file-row:hover { background: rgba(255,255,255,0.02); }
        .context-menu-btn { cursor: pointer; color: var(--text-muted); font-weight: bold; text-align: left; position: relative; }
        .dropdown-menu { display: none; position: absolute; left: 0; background: #181d30; border: 1px solid var(--border); border-radius: 4px; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .dropdown-menu button { display: block; width: 120px; padding: 10px; background: none; border: none; color: #fff; text-align: right; cursor: pointer; font-size: 13px; }
        .dropdown-menu button:hover { background: var(--blue); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-icon active" onclick="switchPage('console')">💻</div>
        <div class="sidebar-icon" onclick="switchPage('files')">📂</div>
    </div>

    <div class="main-content">
        <div class="nav-tabs">
            <button class="tab-btn active" id="t-console" onclick="switchPage('console')">الكونسول الرئيسي</button>
            <button class="tab-btn" id="t-files" onclick="switchPage('files')">إدارة الملفات</button>
        </div>

        <div id="page-console">
            <div class="info-bar">
                <span id="status-dot" class="status-dot status-offline"></span> حالة الحاوية: <span id="status-txt" style="color:#fff; margin-left:20px;">OFFLINE</span>
                💾 الذاكرة المستهلكة: <span style="color:#fff;">0 KB / 1 GB</span>
            </div>
            
            <div class="btn-action-group">
                <button class="btn-ctrl btn-start" onclick="sendControl('start')">START</button>
                <button class="btn-ctrl btn-restart" onclick="sendControl('restart')">RESTART</button>
                <button class="btn-ctrl btn-stop" onclick="sendControl('stop')">STOP</button>
            </div>
            
            <div class="console-screen" id="console-output">
                [OptikLink]>> Server marked as offline...
            </div>
        </div>

        <div id="page-files" class="hidden">
            <div class="files-top">
                <span style="color: var(--text-muted);">المسار الحلي: <code style="color:#fff;">/home/container/</code></span>
                <div>
                    <input type="file" id="fileInput" style="display:none;" onchange="uploadFile()">
                    <button class="btn-ctrl btn-start" onclick="document.getElementById('fileInput').click()">UPLOAD</button>
                </div>
            </div>

            <table class="file-table">
                <thead>
                    <tr>
                        <th>اسم الملف</th>
                        <th>الحجم</th>
                        <th>تاريخ الرفع</th>
                        <th style="text-align:left;">خيارات</th>
                    </tr>
                </thead>
                <tbody id="files-list">
                    </tbody>
            </table>
        </div>
    </div>

<script>
    // التبديل بين الكونسول والملفات
    function switchPage(page) {
        if(page === 'console') {
            document.getElementById('page-console').classList.remove('hidden');
            document.getElementById('page-files').classList.add('hidden');
            document.getElementById('t-console').classList.add('active');
            document.getElementById('t-files').classList.remove('active');
        } else {
            document.getElementById('page-console').classList.add('hidden');
            document.getElementById('page-files').classList.remove('hidden');
            document.getElementById('t-console').classList.remove('active');
            document.getElementById('t-files').classList.add('active');
            loadFiles();
        }
    }

    // إدارة الكونسول والتحكم بالبوت
    async function sendControl(action) {
        const out = document.getElementById('console-output');
        const dot = document.getElementById('status-dot');
        const txt = document.getElementById('status-txt');

        const res = await fetch('/api/bot/control', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ action })
        });
        const data = await res.json();
        
        out.innerText += "\n" + data.output;
        out.scrollTop = out.scrollHeight;

        if(action === 'start' || action === 'restart') {
            if(data.status !== 'error') {
                dot.className = "status-dot status-online";
                txt.textContent = "ONLINE";
            }
        } else {
            dot.className = "status-dot status-offline";
            txt.textContent = "OFFLINE";
        }
    }

    // جلب وعرض الملفات المرفوعة
    async function loadFiles() {
        const tbody = document.getElementById('files-list');
        tbody.innerHTML = "";
        const res = await fetch('/api/files');
        const data = await res.json();

        data.files.forEach((file, index) => {
            tbody.innerHTML += `
                <tr class="file-row">
                    <td style="color: #58a6ff;">📄 ${file.name}</td>
                    <td>${file.size}</td>
                    <td style="color: var(--text-muted);">${file.time}</td>
                    <td class="context-menu-btn" style="text-align:left;" onclick="toggleMenu(${index})">...
                        <div class="dropdown-menu" id="menu-${index}">
                            <button onclick="fileAction('unarchive', '${file.name}')">Unarchive</button>
                            <button onclick="fileAction('delete', '${file.name}')" style="color:var(--red);">Delete</button>
                        </div>
                    </td>
                </tr>
            `;
        });
    }

    function toggleMenu(index) {
        const menu = document.getElementById(`menu-${index}`);
        const current = menu.style.display;
        document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');
        menu.style.display = current === 'block' ? 'none' : 'block';
    }

    // رفع ملفات جديدة حية للسيرفر
    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        await fetch('/api/files/upload', { method: 'POST', body: formData });
        loadFiles();
    }

    // تشغيل الإجراءات (فك الضغط أو مسح)
    async function fileAction(action, fileName) {
        await fetch('/api/files/action', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ action, fileName })
        });
        loadFiles();
    }
</script>
</body>
</html>
