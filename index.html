<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S7ADOW HOST | منصة رفع وتشغيل البوتات</title>
    <style>
        :root {
            --bg-dark: #090c10;
            --panel-dark: #161b22;
            --border-color: #30363d;
            --accent-blue: #58a6ff;
            --neon-green: #2ea44f;
            --neon-red: #da3637;
            --text-color: #c9d1d9;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
        }
        .card {
            background-color: var(--panel-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { color: #fff; margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        h2 span { color: var(--accent-blue); }
        
        /* إعدادات فورم الرفع */
        .upload-zone {
            border: 2px dashed var(--accent-blue);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            background: rgba(88, 166, 255, 0.03);
            margin-bottom: 15px;
            cursor: pointer;
        }
        input[type="file"] { display: none; }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-upload { background-color: var(--accent-blue); color: #000; width: 100%; }
        .btn-start { background-color: var(--neon-green); color: #fff; flex: 1; }
        .btn-stop { background-color: var(--neon-red); color: #fff; flex: 1; }
        .btn-group { display: flex; gap: 15px; margin-top: 15px; }

        .terminal {
            background-color: #010409;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-family: monospace;
            height: 150px;
            overflow-y: auto;
            color: #8b949e;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center; margin-bottom: 30px;">
        <h1 style="color: #fff; margin: 0;">S7ADOW <span>CLOUD</span></h1>
        <p style="color: #8b949e;">ارفع ملفات بوتك واجعله يعمل 24 ساعة مجاناً</p>
    </div>

    <div class="card">
        <h2>1. رفع ملفات البوت (Zip)</h2>
        <form id="uploadForm">
            <label for="botZip" class="upload-zone" id="dropZone">
                اضغط هنا لاختيار ملف البوت المضغوط (.zip)
            </label>
            <input type="file" id="botZip" name="botZip" accept=".zip" required onchange="fileSelected(this)">
            <button type="submit" class="btn btn-upload">ابدأ رفع وحفظ الملفات</button>
        </form>
    </div>

    <div class="card">
        <h2>2. لوحة التحكم والتشغيل</h2>
        <p>ملاحظة: تأكد أن ملفك الرئيسي داخل الـ Zip يسمى <code style="color: var(--accent-blue);">index.js</code></p>
        
        <div class="btn-group">
            <button class="btn btn-start" onclick="controlBot('start')">تشغيل البوت</button>
            <button class="btn btn-stop" onclick="controlBot('stop') font-weight: bold;">إيقاف البوت</button>
        </div>

        <div class="terminal" id="logTerminal">> نظام الاستضافة جاهز ومستقر...</div>
    </div>
</div>

<script>
    const terminal = document.getElementById('logTerminal');

    function fileSelected(input) {
        const zone = document.getElementById('dropZone');
        if(input.files.length > 0) {
            zone.textContent = "الملف المختار: " + input.files[0].name;
            zone.style.borderColor = "var(--neon-green)";
        }
    }

    // معالجة رفع الملف بدون تحديث الصفحة
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        terminal.innerHTML += `<br><span style="color: #fff;">[رفع] جاري إرسال ملف الـ Zip إلى السيرفر...</span>`;

        try {
            const response = await fetch('/api/upload-bot', { method: 'POST', body: formData });
            const data = await response.json();
            if(response.ok) {
                terminal.innerHTML += `<br><span style="color: var(--neon-green);">> ${data.message}</span>`;
            } else {
                terminal.innerHTML += `<br><span style="color: var(--neon-red);">> خطأ: ${data.message}</span>`;
            }
        } catch (err) {
            terminal.innerHTML += `<br><span style="color: var(--neon-red);">> فشل الاتصال بالسيرفر أثناء الرفع.</span>`;
        }
        terminal.scrollTop = terminal.scrollHeight;
    });

    // التحكم في تشغيل البوت المرفوع
    async function controlBot(action) {
        terminal.innerHTML += `<br><span style="color: #fff;">[تحكم] جاري إرسال أمر (${action}) للبوت...</span>`;
        try {
            const response = await fetch('/api/bot-control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action })
            });
            const data = await response.json();
            if(response.ok) {
                const color = action === 'start' ? 'var(--neon-green)' : 'var(--neon-red)';
                terminal.innerHTML += `<br><span style="color: ${color};">> ${data.message}</span>`;
            } else {
                terminal.innerHTML += `<br><span style="color: var(--neon-red);">> خطأ: ${data.message}</span>`;
            }
        } catch (err) {
            terminal.innerHTML += `<br><span style="color: var(--neon-red);">> تعذر تنفيذ الأمر، تأكد من حالة السيرفر.</span>`;
        }
        terminal.scrollTop = terminal.scrollHeight;
    }
</script>

</body>
</html>
